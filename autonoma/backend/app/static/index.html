<!DOCTYPE html>
<html lang="en" data-accent="cyan">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autonoma — Agent Command Center</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◈</span>
      <span class="brand-name">AUTONOMA</span>
      <span class="brand-sub">agent command center</span>
    </div>
    <div class="topbar-controls">
      <label class="control">
        <span>Inference</span>
        <select id="inference-mode">
          <option value="local">Local</option>
          <option value="api_based">API-Based</option>
          <option value="hybrid">Hybrid</option>
        </select>
      </label>
      <label class="control">
        <span>Input mode</span>
        <select id="behavior-mode">
          <option value="human_like">Human-like</option>
          <option value="machine_speed">Machine-speed</option>
        </select>
      </label>
      <label class="control">
        <span>Agents</span>
        <select id="agent-count">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
        </select>
      </label>
      <div class="accent-swatches" title="Neon accent">
        <button class="swatch" data-accent="cyan" style="--s:#22e0e0"></button>
        <button class="swatch" data-accent="magenta" style="--s:#ff3df0"></button>
        <button class="swatch" data-accent="lime" style="--s:#b6ff2e"></button>
      </div>
      <div id="conn" class="conn offline" title="Live connection">● live</div>
    </div>
  </header>

  <main class="grid">
    <section class="panel span-2" id="tasks-panel">
      <div class="panel-head">
        <h2>Task Monitor</h2>
        <button class="btn" id="new-task-btn">+ New Task</button>
      </div>
      <div id="task-cards" class="task-cards"></div>
    </section>

    <section class="panel" id="agents-panel">
      <div class="panel-head"><h2>Agents</h2><span id="lock-holder" class="chip">lock: free</span></div>
      <div id="agent-list" class="agent-list"></div>
      <div class="cost" id="cost-line"></div>
    </section>

    <section class="panel" id="approvals-panel">
      <div class="panel-head"><h2>Approvals</h2><span class="chip warn" id="approval-count">0</span></div>
      <div id="approvals" class="approvals"><div class="empty">No pending approvals</div></div>
    </section>

    <section class="panel span-2" id="inference-panel">
      <div class="panel-head"><h2>Hardware Requirements</h2><span class="chip" id="sys-info"></span></div>
      <div id="hw-cards" class="hw-cards"></div>
    </section>

    <section class="panel" id="skills-panel">
      <div class="panel-head"><h2>Skills</h2><span class="chip" id="skill-count">0</span></div>
      <div id="skill-list" class="skill-list"></div>
    </section>

    <section class="panel span-3" id="audit-panel">
      <div class="panel-head"><h2>Live Audit &amp; Activity Feed</h2></div>
      <div id="audit-feed" class="audit-feed"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="task-modal" hidden>
    <div class="modal">
      <h3>Create Task</h3>
      <label>Title <input id="t-title" placeholder="Log into desktop app" /></label>
      <label>Skill
        <select id="t-skill"></select>
      </label>
      <label>Input (JSON) <textarea id="t-input" rows="4">{"username": "demo"}</textarea></label>
      <label>Coordination
        <select id="t-coord"><option value="independent">Independent</option><option value="collaborative">Collaborative</option></select>
      </label>
      <div class="modal-actions">
        <button class="btn ghost" id="t-cancel">Cancel</button>
        <button class="btn" id="t-create">Create</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="drill-modal" hidden>
    <div class="modal wide">
      <div class="panel-head"><h3 id="drill-title">Task</h3><button class="btn ghost" id="drill-close">Close</button></div>
      <div id="drill-body"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
